{% extends 'billing/base_dashboard.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-exclamation-triangle"></i> Payment Failed
                    </h4>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="fas fa-times-circle text-danger" style="font-size: 4rem;"></i>
                    </div>
                    <h5 class="text-danger">Payment verification failed</h5>
                    <p class="text-muted">
                        We couldn't verify your payment. Please try again or contact support if the issue persists.
                    </p>
                    <div class="mt-4">
                        <a href="{% url 'payment_page' %}" class="btn btn-primary">
                            <i class="fas fa-redo"></i> Try Again
                        </a>
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary ms-2">
                            Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
