{% extends 'base_dashboard.html' %}
{% block title %}Add Patient{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-primary text-white p-4 rounded-top-4">
                    <h4 class="mb-1 text-white fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Add New Patient</h4>
                    <p class="mb-0 text-white-50 small">Enter patient demographic details and profile photo</p>
                </div>
                <div class="card-body p-4">
                    <form method="post" enctype="multipart/form-data" class="needs-validation">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name *</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="e.g. John Doe" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="dob" class="form-label fw-semibold">Date of Birth</label>
                                <input type="date" id="dob" name="dob" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input type="text" id="phone" name="phone" class="form-control" placeholder="+234...">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="photo" class="form-label fw-semibold">Patient Photo</label>
                            <input type="file" id="photo" name="photo" class="form-control" accept="image/*">
                            <small class="text-muted">Optional patient identification image.</small>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                            <a href="{% url 'patient_list' %}" class="btn btn-outline-secondary px-4 rounded-3">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 rounded-3 fw-semibold"><i class="bi bi-check-lg me-1"></i> Create Patient</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
