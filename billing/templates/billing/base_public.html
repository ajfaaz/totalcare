{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}TotalCare HMS - Smart Digital Hospital Management System{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Favicon Links -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
    <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<!-- Public Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-2">
    <div class="container">
        <!-- New TotalCare Brand Logo -->
        <a class="navbar-brand p-0 m-0 d-flex align-items-center" href="/">
            <img src="{% static 'images/logo_totalcare.png' %}" height="48" alt="TotalCare HMS" class="d-inline-block align-text-top">
        </a>

        <div class="d-flex align-items-center gap-2">
            <a href="{% url 'login' %}" class="btn btn-outline-primary fw-semibold px-4">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </a>
            <a href="{% url 'demo_signup' %}" class="btn btn-primary fw-semibold px-4">
                <i class="bi bi-rocket-takeoff me-1"></i> Start Free Demo
            </a>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">&copy; 2026 TotalCare HMS | ArewaNet Ventures</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
